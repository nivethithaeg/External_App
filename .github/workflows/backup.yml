name: Daily database backup
on:
  schedule: [{ cron: '30 20 * * *' }]   # 02:00 IST every day
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Dump the database
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
        run: pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=custom --file=playnx-$(date -u +%F).dump
      - name: Encrypt it (the dump contains customer data)
        env: { BACKUP_PASSPHRASE: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: |
          for f in playnx-*.dump; do gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 "$f" && rm "$f"; done
      - uses: actions/upload-artifact@v4
        with: { name: playnx-backup, path: 'playnx-*.dump.gpg', retention-days: 14 }
